# Render Blueprint for the Synferrous FastAPI backend.
# Optional convenience: in Render you can click "New +" -> "Blueprint" and point
# it at this repo, OR just create a Web Service manually with the settings shown
# in DEPLOY.md. Either way, fill the env vars marked "sync: false" in the dashboard.
services:
  - type: web
    name: rkailabs-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGO_URL          # from MongoDB Atlas (set in dashboard)
        sync: false
      - key: DB_NAME
        value: rkailabs
      - key: JWT_SECRET          # auto-generated secure value
        generateValue: true
      - key: ADMIN_EMAIL         # your admin login email
        sync: false
      - key: ADMIN_PASSWORD      # your admin login password
        sync: false
      - key: CORS_ORIGINS        # your Vercel frontend URL, e.g. https://your-app.vercel.app
        sync: false
      - key: SITE_URL            # same Vercel frontend URL
        sync: false
      - key: ANTHROPIC_API_KEY   # optional — enables Aria chat
        sync: false
      - key: CHAT_MODEL
        value: claude-sonnet-4-5-20250929
      # Image storage — see DEPLOY.md Step 5 (values from the CloudFormation Outputs)
      - key: S3_BUCKET
        sync: false
      - key: MEDIA_BASE_URL
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
