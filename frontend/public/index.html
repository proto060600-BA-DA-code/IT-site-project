<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0D1321" />
        <!--
        Fallback head. On every real page, scripts/prerender-meta.js replaces
        the title, description, canonical, Open Graph and JSON-LD below with
        per-page values from the CMS. These only show if that step was skipped.
        -->
        <meta name="description" content="Synferrous — business analysis, e-commerce builds and practical AI by Rohan Kapoor. Requirements, order management, analytics and launches, Delhi NCR." />
        <meta property="og:title" content="Synferrous — Business Analysis, E-commerce & AI" />
        <meta property="og:description" content="Business analysis, e-commerce builds and practical AI — scoped and delivered by Rohan Kapoor. Fixed-scope services with published prices." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://synferrous.com/" />
        <link rel="canonical" href="https://synferrous.com/" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <!-- Typography uses the native system font (San Francisco on Apple
             devices). No webfonts to download. -->
        <title>Synferrous — Business Analysis, E-commerce & AI</title>
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Synferrous — Business Analysis, E-commerce & AI" />
        <meta name="twitter:description" content="Business analysis, e-commerce builds and practical AI — scoped and delivered by Rohan Kapoor." />
        <meta property="og:site_name" content="Synferrous" />
        <meta property="og:locale" content="en_IN" />
        <!--
        Static JSON-LD so non-JavaScript crawlers (many AI engines, social scrapers)
        always see the core business entity, even before the SPA renders.
        -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "ProfessionalService",
          "name": "Synferrous",
          "description": "Business analysis, e-commerce builds and practical AI assistants, delivered by Rohan Kapoor in Delhi NCR, India.",
          "url": "https://synferrous.com/",
          "email": "hello@synferrous.com",
          "areaServed": "IN",
          "address": {
            "@type": "PostalAddress",
            "addressRegion": "Delhi NCR",
            "addressCountry": "IN"
          },
          "founder": {
            "@type": "Person",
            "name": "Rohan Kapoor",
            "jobTitle": "Techno-functional Business Analyst",
            "sameAs": ["https://linkedin.com/in/rohan-kapoor-business-analyst"]
          },
          "knowsAbout": [
            "Business Analysis",
            "Requirements Engineering",
            "Order Management Systems",
            "Salesforce Commerce Cloud",
            "E-commerce Development",
            "Web Analytics",
            "Technical SEO",
            "AI Assistants"
          ]
        }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
